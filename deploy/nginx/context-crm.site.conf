# HTTP: only certificate renewal, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name context-crm.site;

    access_log /var/log/nginx/context-crm.site.access.log;
    error_log /var/log/nginx/context-crm.site.error.log;

    include snippets/context-crm-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name context-crm.site;

    access_log /var/log/nginx/context-crm.site.access.log;
    error_log /var/log/nginx/context-crm.site.error.log;

    include snippets/context-crm-ssl.conf;

    # The landing: dist/ uploaded by GitHub Actions with rsync (.github/workflows/deploy.yml)
    root /var/www/context-crm.site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
