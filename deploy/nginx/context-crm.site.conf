# HTTP: only certificate renewal, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name context-crm.site;

    access_log /var/log/nginx/context-crm.site.access.log;
    error_log /var/log/nginx/context-crm.site.error.log;

    # "Server: nginx" without the version, on the landing only: nginx.conf is shared with the app
    server_tokens off;

    include snippets/context-crm-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name context-crm.site;

    access_log /var/log/nginx/context-crm.site.access.log;
    error_log /var/log/nginx/context-crm.site.error.log;

    server_tokens off;

    # TLS settings and HSTS (Strict-Transport-Security), shared with the app domain.
    # The snippet is not ours alone, so it stays as it is: HSTS is not repeated here.
    include snippets/context-crm-ssl.conf;

    # Security headers. Server level on purpose: a location with its own add_header
    # drops all of these, and HSTS from the snippet too. "always" adds them to 404 as well.
    # CSP: everything from this site only. Inline scripts and styles are allowed, no nonce:
    # the page is static and may get them from the build. frame-ancestors and X-Frame-Options:
    # no site, this one included, may show the landing in a frame.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # The landing: dist/ uploaded by GitHub Actions with rsync (.github/workflows/deploy.yml)
    root /var/www/context-crm.site;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
